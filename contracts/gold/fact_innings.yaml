apiVersion: v3.1.0
kind: DataContract
id: cricket-sim.gold.fact_innings
name: fact_innings
version: 1.0.0
status: active
domain: cricket
dataProduct: cricket-sim
description:
  purpose: Innings-level totals and context for every innings in scope, including the target as known at the start
    of the innings next to Cricsheet's final (possibly rain-revised) target, so rain-affected chases are visible
    rather than silently mixed in.
  limitations: Scope as dim_match. target_runs (known at the start) is NULL for rain-revised chases (target_status
    'revised_timing_unknown', 419 innings) and for any chase whose data contradicts its own target ('inconsistent_with_balls'; none in scope);
    final_target_* hold what Cricsheet recorded at the end. For 18 unrevised chases Cricsheet gives no target, so
    target_runs is the first-innings total + 1 and final_target_* are NULL. Totals are summed from the ball-by-ball
    data and include penalty runs.
schema:
- name: fact_innings
  physicalName: data/gold/fact_innings.parquet
  physicalType: table
  logicalType: object
  description: Every innings in scope with its batting side, declaration and forfeit flags, ball and wicket limits,
    the target known at the start and Cricsheet's final target, penalty runs, absent-hurt batters, miscounted overs,
    and totals (deliveries, legal balls, dismissals, runs).
  dataGranularityDescription: One row per innings of an in-scope match (super overs included), keyed by (match_id,
    innings).
  properties:
  - name: match_id
    logicalType: string
    physicalType: VARCHAR
    description: Cricsheet match identifier (the name of the match's file in Cricsheet's download, e.g. '1000851').
      For most internationals it equals the ESPNcricinfo match id, but do not rely on that; use map_match_ids. Joins
      to dim_match.match_id.
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    relationships:
    - to: dim_match.match_id
  - name: innings
    logicalType: integer
    physicalType: SMALLINT
    description: Innings number within the match, from 1, in batting order. Super overs continue the numbering (a
      tied T20 with one super over has innings 3 and 4 as its super-over innings).
    primaryKey: true
    primaryKeyPosition: 2
    required: true
  - name: batting_team
    logicalType: string
    physicalType: VARCHAR
    description: Name of the batting team, as spelled by Cricsheet.
    required: true
  - name: is_super_over
    logicalType: boolean
    physicalType: BOOLEAN
    description: True if this innings is a super over (the one-over-a-side tie-breaker), false otherwise.
    required: true
  - name: declared
    logicalType: boolean
    physicalType: BOOLEAN
    description: True if the batting side declared the innings closed (Tests).
    required: true
  - name: forfeited
    logicalType: boolean
    physicalType: BOOLEAN
    description: True if the innings was forfeited without a ball bowled (none in the current scope).
    required: true
  - name: scheduled_balls_limit
    logicalType: integer
    physicalType: SMALLINT
    description: 'Legal balls the innings was scheduled to have when the match began (scheduled overs x balls per
      over; 6 for a super over; NULL for Tests). Nominal: it ignores any later rain reduction, so it never reveals
      the future and is safe as a model input.'
    customProperties:
    - property: unit
      value: balls
  - name: nominal_target_runs
    logicalType: integer
    physicalType: INTEGER
    description: 'The target as it stood when the innings began, before any later revision: first-innings total
      + 1 for a limited-overs chase, the previous super-over innings + 1, or the Test fourth-innings target. NULL
      when the innings is not chasing. Safe as a model input; differs from the official target only when rain later
      revised it.'
    customProperties:
    - property: unit
      value: runs
  - name: innings_balls_limit
    logicalType: integer
    physicalType: SMALLINT
    description: 'Maximum legal balls the innings could last, as known before its first ball: scheduled overs x
      balls per over (300 in a 50-over ODI, 120 in a T20) plus the extra balls of any over Cricsheet lists as
      miscounted (a listed 7-ball over makes it 301, a 5-ball over 299), or one over (6 balls) for a super over.
      NULL for Tests
      (no limit) and whenever the innings may have been shortened at a time the data cannot tell (innings_length_status
      = ''reduced_timing_unknown'', e.g. rain-revised chases).'
    customProperties:
    - property: unit
      value: balls
  - name: innings_length_status
    logicalType: string
    physicalType: VARCHAR
    description: 'How much of the innings'' length is known before it starts. ''full_known'' = a limited-overs innings
      whose full scheduled allocation applied from its first ball (a first innings that used all its balls or was
      bowled out, or any innings of a match whose chase was unrevised); ''reduced_timing_unknown'' = a limited-overs
      innings that may have been shortened (usually by rain) at an unknown moment: a rain-revised or inconsistent
      chase, or a first innings that ended early without being bowled out. Cricsheet does not record when overs
      were lost, so no ball limit is given; ''unlimited'' = a Test innings (no over limit); ''super_over'' = a super-over
      innings (6 balls, 2 wickets).'
    required: true
    quality:
    - name: valid_length_status
      metric: invalidValues
      arguments:
        validValues:
        - full_known
        - reduced_timing_unknown
        - unlimited
        - super_over
      mustBe: 0
  - name: wickets_limit
    logicalType: integer
    physicalType: INTEGER
    description: 'Dismissals that end the innings: 10, or 2 in a super over. When batters are absent hurt (batters_absent
      > 0) the innings actually ends after wickets_limit - batters_absent dismissals.'
    required: true
    customProperties:
    - property: unit
      value: wickets
    quality:
    - name: valid_wickets_limit
      metric: invalidValues
      arguments:
        validValues:
        - 10
        - 2
      mustBe: 0
  - name: target_runs
    logicalType: integer
    physicalType: INTEGER
    description: 'Runs the batting side must reach to win, as known at the start of the innings (it never changes
      mid-innings). Set only when target_status is ''set'' (unrevised limited-overs chase: Cricsheet''s stated target,
      or the first-innings total + 1 when Cricsheet gives none), ''super_over_derived'' (the first super-over innings''
      total + 1) or ''test_derived'' (Test fourth innings: the opposition''s runs minus the batting side''s runs
      over innings 1-3, + 1). NULL otherwise, including rain-revised chases: Cricsheet stores only the FINAL revised
      target, not when it was set, so using it ball by ball would leak the future.'
    customProperties:
    - property: unit
      value: runs
  - name: target_status
    logicalType: string
    physicalType: VARCHAR
    description: Why target_runs has (or lacks) a value. 'set' = unrevised limited-overs chase, target and ball
      limit known; 'revised_timing_unknown' = chase revised by a rain rule (D/L) or set over fewer than the scheduled
      overs; Cricsheet records only the final revised target, so target_runs and innings_balls_limit are NULL; 'inconsistent_with_balls'
      = a chase that looks unrevised but whose own balls contradict its target (it reached the target, or used up
      its overs, before its last ball), treated as unknown, so NULL; 'super_over_derived' = second innings of a
      super over; 'test_derived' = fourth innings of a Test; 'none' = no target applies (first innings, first super-over
      innings, Test innings 1-3).
    required: true
    quality:
    - name: valid_target_status
      metric: invalidValues
      arguments:
        validValues:
        - none
        - set
        - revised_timing_unknown
        - inconsistent_with_balls
        - super_over_derived
        - test_derived
      mustBe: 0
  - name: test_lead_at_start
    logicalType: integer
    physicalType: INTEGER
    description: 'Tests only: runs the batting side had banked in the match before this innings minus the opposition''s
      (innings totals including penalty runs). 0 for the first innings; negative = trailing. NULL for limited-overs
      and super-over innings.'
    customProperties:
    - property: unit
      value: runs
  - name: final_target_runs
    logicalType: integer
    physicalType: INTEGER
    description: 'Target exactly as Cricsheet records it for this innings: the FINAL target, after any rain revision,
      so it may not have been known when the innings started. NULL when Cricsheet records none (first innings, Tests,
      super overs, some chases).'
    customProperties:
    - property: unit
      value: runs
  - name: final_target_overs
    logicalType: string
    physicalType: VARCHAR
    description: Overs available for the final target, as Cricsheet writes them in cricket notation (text; '37.4'
      = 37 overs and 4 balls). Fewer than scheduled means a revised chase. NULL when Cricsheet records no target.
  - name: final_target_balls
    logicalType: integer
    physicalType: INTEGER
    description: final_target_overs converted to balls in cricket notation (37.4 overs = 37 x 6 + 4 = 226 balls).
      NULL when Cricsheet records no target.
    customProperties:
    - property: unit
      value: balls
  - name: penalty_runs_pre
    logicalType: integer
    physicalType: SMALLINT
    description: Penalty runs awarded to the batting side before the innings started (0 when none).
    required: true
    customProperties:
    - property: unit
      value: runs
    quality:
    - name: non_negative
      type: sql
      query: SELECT count(*) FROM ${table} WHERE ${column} < 0
      mustBe: 0
  - name: penalty_runs_post
    logicalType: integer
    physicalType: SMALLINT
    description: Penalty runs awarded to the batting side after the innings ended (0 when none). Included in runs
      and, once the innings is over, in the nominal target and lead of later innings; never in a _before column of
      this innings itself.
    required: true
    customProperties:
    - property: unit
      value: runs
    quality:
    - name: non_negative
      type: sql
      query: SELECT count(*) FROM ${table} WHERE ${column} < 0
      mustBe: 0
  - name: batters_absent
    logicalType: integer
    physicalType: BIGINT
    description: Number of batters listed as absent hurt in this innings (count of names in absent_hurt).
    required: true
    customProperties:
    - property: unit
      value: batters
  - name: absent_hurt
    logicalType: string
    physicalType: VARCHAR
    description: Names of batters who were absent hurt and did not bat, '|'-separated, as written in Cricsheet.
      NULL when none.
  - name: miscounted_overs
    logicalType: string
    physicalType: VARCHAR
    description: 'Overs Cricsheet notes the umpire miscounted, as JSON keyed by 0-based over number, e.g. {"39":
      {"balls": 7, "umpire": "RA Kettleborough"}}. NULL when none.'
  - name: deliveries
    logicalType: integer
    physicalType: BIGINT
    description: Deliveries recorded in the innings, wides and no-balls included.
    required: true
    customProperties:
    - property: unit
      value: balls
  - name: legal_balls
    logicalType: integer
    physicalType: BIGINT
    description: Legal deliveries (not wides or no-balls) in the innings.
    required: true
    customProperties:
    - property: unit
      value: balls
  - name: dismissals
    logicalType: integer
    physicalType: SMALLINT
    description: Dismissals in the innings (retired hurt / retired not out excluded).
    required: true
    customProperties:
    - property: unit
      value: wickets
  - name: runs
    logicalType: integer
    physicalType: INTEGER
    description: 'Innings total: runs from every delivery plus penalty_runs_pre and penalty_runs_post.'
    required: true
    customProperties:
    - property: unit
      value: runs
  quality:
  - name: row_count_floor_full_data
    description: on the complete snapshots, at least about 95% of the 13,253 rows of the 2026-10-27 real
      build, so a snapshot or step that silently lost rows fails (skipped for the SUBSET CI sample)
    metric: rowCount
    mustBeGreaterOrEqualTo: 12000
    customProperties:
    - property: fullDataOnly
      value: true
  - name: row_count_floor
    metric: rowCount
    mustBeGreaterOrEqualTo: 13
  - name: legal_balls_within_deliveries
    description: legal balls never exceed deliveries
    type: sql
    query: SELECT count(*) FROM ${table} WHERE legal_balls > deliveries
    mustBe: 0
  - name: dismissals_within_limit
    description: no innings has more dismissals than its limit
    type: sql
    query: SELECT count(*) FROM ${table} WHERE dismissals > wickets_limit
    mustBe: 0
  - name: target_present_iff_known
    description: target_runs is filled exactly when target_status says the target is known
    type: sql
    query: SELECT count(*) FROM ${table} WHERE (target_runs IS NOT NULL) <> (target_status IN ('set', 'super_over_derived',
      'test_derived'))
    mustBe: 0
  - name: ball_limit_present_iff_known
    description: innings_balls_limit is filled exactly when the innings length is known
    type: sql
    query: SELECT count(*) FROM ${table} WHERE (innings_balls_limit IS NOT NULL) <> (innings_length_status IN ('full_known',
      'super_over'))
    mustBe: 0
  - name: nominal_target_equals_target
    description: where the target is known without a rain revision, the nominal target is that target
    type: sql
    query: SELECT count(*) FROM ${table} WHERE target_status IN ('set', 'super_over_derived', 'test_derived') AND
      nominal_target_runs IS DISTINCT FROM target_runs
    mustBe: 0
  - name: set_target_equals_stated
    description: an unrevised chase's start-of-innings target is the target Cricsheet records
    type: sql
    query: SELECT count(*) FROM ${table} WHERE target_status = 'set' AND final_target_runs IS NOT NULL AND target_runs
      <> final_target_runs
    mustBe: 0
customProperties:
- property: layer
  value: gold
- property: kind
  value: fact
- property: sources
  value:
  - cricsheet
  - derived
- property: upstream
  value:
  - innings
  - matches
  - int_innings_state
  - balls
