apiVersion: v3.1.0
kind: DataContract
id: cricket-sim.gold.map_venue_alias
name: map_venue_alias
version: 1.0.0
status: active
domain: cricket
dataProduct: cricket-sim
description:
  purpose: Crosswalk from every (venue, city) spelling Cricsheet uses for an in-scope ground to the canonical venue_id,
    so matches at the same ground can be grouped and other datasets keyed on Cricsheet's venue strings can be joined.
  limitations: Covers the grounds of in-scope matches only (every venue_id here has a row in dim_venue), but each
    spelling's n_matches counts every Cricsheet match of every format and gender that uses it, and a spelling used
    only outside scope is absent. Spellings are mapped by a normalised-name rule plus manual merges and splits
    (config/venue_overrides.yml); a rare wrong merge or split is possible.
schema:
- name: map_venue_alias
  physicalName: data/gold/map_venue_alias.parquet
  physicalType: table
  logicalType: object
  description: Every distinct (venue, city) string pair Cricsheet uses for a ground that an in-scope match was played
    at, with the canonical venue_id it maps to and how often it occurs across all of Cricsheet.
  dataGranularityDescription: One row per distinct (venue, city) pair in Cricsheet whose venue_id is in dim_venue;
    city can be NULL.
  properties:
  - name: venue
    logicalType: string
    physicalType: VARCHAR
    description: Venue name exactly as Cricsheet spells it (leading spaces and typos preserved).
    required: true
  - name: city
    logicalType: string
    physicalType: VARCHAR
    description: City exactly as Cricsheet gives it alongside that venue string; NULL when Cricsheet gives none.
  - name: venue_id
    logicalType: string
    physicalType: VARCHAR
    description: Canonical venue identifier this spelling maps to; every value is a dim_venue.venue_id.
    required: true
    relationships:
    - to: dim_venue.venue_id
  - name: n_matches
    logicalType: integer
    physicalType: BIGINT
    description: Number of Cricsheet matches (all, not only in scope) that use this exact (venue, city) pair.
    required: true
    customProperties:
    - property: unit
      value: matches
    quality:
    - name: positive
      type: sql
      query: SELECT count(*) FROM ${table} WHERE ${column} < 1
      mustBe: 0
  quality:
  - name: row_count_floor_full_data
    description: on the complete snapshots, at least 90 to 95% of the 466 rows of the 2026-10-27 real
      build, so a snapshot or step that silently lost rows fails (skipped for the SUBSET CI sample)
    metric: rowCount
    mustBeGreaterOrEqualTo: 440
    customProperties:
    - property: fullDataOnly
      value: true
  - name: one_row_per_spelling
    description: each (venue, city) pair appears once, so it maps to one venue_id
    type: sql
    query: SELECT count(*) - count(DISTINCT (venue, city)) FROM ${table}
    mustBe: 0
customProperties:
- property: layer
  value: gold
- property: kind
  value: map
- property: sources
  value:
  - cricsheet
  - derived
- property: upstream
  value:
  - venue_aliases
  - match_venues
