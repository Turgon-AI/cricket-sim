apiVersion: v3.1.0
kind: DataContract
id: cricket-sim.gold.int_innings_state
name: int_innings_state
version: 1.0.0
status: active
domain: cricket
dataProduct: cricket-sim
description:
  purpose: The facts about an innings that are knowable before its first ball (ball limit, wicket limit, target,
    Test lead), derived honestly from Cricsheet. The building block for the per-ball pre-ball state.
  limitations: 'Covers every Cricsheet match of every format, gender and competition (no scope applied). Cricsheet
    stores only the final, possibly rain-revised, target and not when overs were lost, so rain-affected chases get
    NULL target and ball limit (target_status ''revised_timing_unknown'') and a first innings that ended early without
    being bowled out gets NULL ball limit (''reduced_timing_unknown''); these are unknowns, not zeros. Targets for
    super overs and Test fourth innings are derived from innings totals, not read from the source. Intermediate
    table: not exported.'
schema:
- name: int_innings_state
  physicalName: data/gold/int_innings_state.parquet
  physicalType: table
  logicalType: object
  description: Per-innings match state as known at the start of the innings, for every Cricsheet match. Feeds int_ball_state_pre
    (which adds the running score) and fact_innings.
  dataGranularityDescription: One row per innings of a Cricsheet match (super overs included), keyed by (match_id,
    innings).
  properties:
  - name: match_id
    logicalType: string
    physicalType: VARCHAR
    description: Cricsheet match identifier (the name of the match's file in Cricsheet's download, e.g. '1000851').
      For most internationals it equals the ESPNcricinfo match id, but do not rely on that; use map_match_ids.
    primaryKey: true
    primaryKeyPosition: 1
    required: true
  - name: innings
    logicalType: integer
    physicalType: SMALLINT
    description: Innings number within the match, from 1, in batting order. Super overs continue the numbering (a
      tied T20 with one super over has innings 3 and 4 as its super-over innings).
    primaryKey: true
    primaryKeyPosition: 2
    required: true
  - name: is_super_over
    logicalType: boolean
    physicalType: BOOLEAN
    description: True if this innings is a super over (the one-over-a-side tie-breaker), false otherwise.
    required: true
  - name: pen_pre
    logicalType: integer
    physicalType: SMALLINT
    description: Penalty runs awarded to the batting side before this innings started (Cricsheet penalty_runs.pre),
      0 when none. They count toward the innings score from its first ball.
    required: true
    customProperties:
    - property: unit
      value: runs
    quality:
    - name: non_negative
      type: sql
      query: SELECT count(*) FROM ${table} WHERE ${column} < 0
      mustBe: 0
  - name: batters_absent
    logicalType: integer
    physicalType: BIGINT
    description: Number of batters Cricsheet lists as absent hurt (unable to bat) in this innings, usually 0. Recorded
      once per innings, so it is treated as known from the innings' first ball.
    required: true
    customProperties:
    - property: unit
      value: batters
  - name: wickets_limit
    logicalType: integer
    physicalType: INTEGER
    description: 'Dismissals that end the innings: 10, or 2 in a super over. When batters are absent hurt (batters_absent
      > 0) the innings actually ends after wickets_limit - batters_absent dismissals.'
    required: true
    customProperties:
    - property: unit
      value: wickets
    quality:
    - name: valid_wickets_limit
      metric: invalidValues
      arguments:
        validValues:
        - 10
        - 2
      mustBe: 0
  - name: scheduled_balls_limit
    logicalType: integer
    physicalType: SMALLINT
    description: 'Legal balls the innings was scheduled to have when the match began (scheduled overs x balls per
      over; 6 for a super over; NULL for Tests). Nominal: it ignores any later rain reduction, so it never reveals
      the future and is safe as a model input.'
    customProperties:
    - property: unit
      value: balls
  - name: nominal_target_runs
    logicalType: integer
    physicalType: INTEGER
    description: 'Nominal target from completed innings: the innings totals including every penalty run they
      received (post-innings awards too), + 1 for a limited-overs or super-over chase, or the corresponding Test
      fourth-innings balance + 1. NULL when not chasing. Equals target_runs whenever target_runs is set; it
      differs from the official target only when a rain rule revised it.'
    customProperties:
    - property: unit
      value: runs
  - name: innings_balls_limit
    logicalType: integer
    physicalType: SMALLINT
    description: 'Maximum legal balls the innings could last, as known before its first ball: scheduled overs x
      balls per over (300 in a 50-over ODI, 120 in a T20) plus the extra balls of any over Cricsheet lists as
      miscounted (a listed 7-ball over makes it 301, a 5-ball over 299), or one over (6 balls) for a super over.
      NULL for Tests
      (no limit) and whenever the innings may have been shortened at a time the data cannot tell (innings_length_status
      = ''reduced_timing_unknown'', e.g. rain-revised chases).'
    customProperties:
    - property: unit
      value: balls
  - name: innings_length_status
    logicalType: string
    physicalType: VARCHAR
    description: 'How much of the innings'' length is known before it starts. ''full_known'' = a limited-overs innings
      whose full scheduled allocation applied from its first ball (a first innings that used all its balls or was
      bowled out, or any innings of a match whose chase was unrevised); ''reduced_timing_unknown'' = a limited-overs
      innings that may have been shortened (usually by rain) at an unknown moment: a rain-revised or inconsistent
      chase, or a first innings that ended early without being bowled out. Cricsheet does not record when overs
      were lost, so no ball limit is given; ''unlimited'' = a Test innings (no over limit); ''super_over'' = a super-over
      innings (6 balls, 2 wickets).'
    required: true
    quality:
    - name: valid_length_status
      metric: invalidValues
      arguments:
        validValues:
        - full_known
        - reduced_timing_unknown
        - unlimited
        - super_over
      mustBe: 0
  - name: target_runs
    logicalType: integer
    physicalType: INTEGER
    description: 'Runs the batting side must reach to win, as known at the start of the innings (it never changes
      mid-innings). Set only when target_status is ''set'' (unrevised limited-overs chase: Cricsheet''s stated target,
      or the first-innings total + 1 when Cricsheet gives none), ''super_over_derived'' (the first super-over innings''
      total + 1) or ''test_derived'' (Test fourth innings: the opposition''s runs minus the batting side''s runs
      over innings 1-3, + 1). NULL otherwise, including rain-revised chases: Cricsheet stores only the FINAL revised
      target, not when it was set, so using it ball by ball would leak the future.'
    customProperties:
    - property: unit
      value: runs
  - name: target_status
    logicalType: string
    physicalType: VARCHAR
    description: Why target_runs has (or lacks) a value. 'set' = unrevised limited-overs chase, target and ball
      limit known; 'revised_timing_unknown' = chase revised by a rain rule (D/L) or set over fewer than the scheduled
      overs; Cricsheet records only the final revised target, so target_runs and innings_balls_limit are NULL; 'inconsistent_with_balls'
      = a chase that looks unrevised but whose own balls contradict its target (it reached the target, or used up
      its overs, before its last ball), treated as unknown, so NULL; 'super_over_derived' = second innings of a
      super over; 'test_derived' = fourth innings of a Test; 'none' = no target applies (first innings, first super-over
      innings, Test innings 1-3).
    required: true
    quality:
    - name: valid_target_status
      metric: invalidValues
      arguments:
        validValues:
        - none
        - set
        - revised_timing_unknown
        - inconsistent_with_balls
        - super_over_derived
        - test_derived
      mustBe: 0
  - name: test_lead_at_start
    logicalType: integer
    physicalType: INTEGER
    description: 'Multi-day (unlimited-overs) innings only: the runs the batting side banked in completed innings
      minus the opposition''s. Includes delivery runs and every penalty run (pre- and post-innings awards).
      0 for the first innings; negative = trailing. NULL for limited-overs and super-over innings.'
    customProperties:
    - property: unit
      value: runs
  quality:
  - name: row_count_floor_full_data
    description: on the complete snapshots, at least 90 to 95% of the 51,196 rows of the 2026-10-27 real
      build, so a snapshot or step that silently lost rows fails (skipped for the SUBSET CI sample)
    metric: rowCount
    mustBeGreaterOrEqualTo: 48000
    customProperties:
    - property: fullDataOnly
      value: true
  - name: target_present_iff_known
    description: target_runs is filled exactly when target_status says the target is known
    type: sql
    query: SELECT count(*) FROM ${table} WHERE (target_runs IS NOT NULL) <> (target_status IN ('set', 'super_over_derived',
      'test_derived'))
    mustBe: 0
  - name: ball_limit_present_iff_known
    description: innings_balls_limit is filled exactly when the innings length is known
    type: sql
    query: SELECT count(*) FROM ${table} WHERE (innings_balls_limit IS NOT NULL) <> (innings_length_status IN ('full_known',
      'super_over'))
    mustBe: 0
  - name: lead_only_unlimited
    description: test_lead_at_start is filled exactly for unlimited-overs innings
    type: sql
    query: SELECT count(*) FROM ${table} WHERE (test_lead_at_start IS NOT NULL) <> (innings_length_status = 'unlimited')
    mustBe: 0
  - name: super_over_consistent
    description: super-over innings, and only they, have length status 'super_over' and a 2-wicket limit
    type: sql
    query: SELECT count(*) FROM ${table} WHERE is_super_over <> (innings_length_status = 'super_over') OR wickets_limit
      <> CASE WHEN is_super_over THEN 2 ELSE 10 END
    mustBe: 0
customProperties:
- property: layer
  value: gold
- property: kind
  value: derived
- property: sources
  value:
  - cricsheet
  - derived
- property: upstream
  value:
  - innings
  - matches
  - balls
