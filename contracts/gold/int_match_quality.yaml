apiVersion: v3.1.0
kind: DataContract
id: cricket-sim.gold.int_match_quality
name: int_match_quality
version: 1.0.0
status: active
domain: cricket
dataProduct: cricket-sim
description:
  purpose: >-
    Per-match consistency checks on the Cricsheet data, so analyses can drop or flag matches whose scorecard does
    not add up. Source of dim_match.passes_quality.
  limitations: >-
    Covers every Cricsheet match (no scope applied). Checks are tri-state: True = passed, False = failed, NULL =
    could not be checked for this match (e.g. a rain-revised result); NULL is not a failure. The checks test internal
    arithmetic only and cannot detect a ball that is wrong but self-consistent. Intermediate table: the in-scope
    copy is report_match_quality.
schema:
- name: int_match_quality
  physicalName: data/gold/int_match_quality.parquet
  physicalType: table
  logicalType: object
  description: >-
    Tri-state data-quality checks for every Cricsheet match, plus the overall passes_quality verdict.
  dataGranularityDescription: One row per Cricsheet match.
  properties:
  - name: match_id
    logicalType: string
    physicalType: VARCHAR
    description: >-
      Cricsheet match identifier (the name of the match's file in Cricsheet's download, e.g. '1000851'). For most
      internationals it equals the ESPNcricinfo match id, but do not rely on that; use map_match_ids.
    primaryKey: true
    primaryKeyPosition: 1
    required: true
  - name: runs_add_up
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      True if on every ball of the match runs_total = runs_batter + runs_extras. Tri-state: NULL would mean not
      checkable (no balls). Guards the parser: it has never failed on Cricsheet data as of the 2026-10-14 snapshot,
      and the headline publishes how often each check fires.
  - name: extras_add_up
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      True if on every ball runs_extras = wides + noballs + byes + legbyes + penalty. Tri-state: NULL = not checkable
      (no balls). Guards the parser: it has never failed on Cricsheet data as of the 2026-10-14 snapshot,
      and the headline publishes how often each check fires.
  - name: overs_consistent
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      True if every over has exactly balls_per_over legal balls, except the last over of an innings (may be shorter)
      and overs Cricsheet itself lists as miscounted by the umpire. False flags an unexplained short or long over.
      NULL = not checkable (no balls per over recorded, or no balls).
  - name: wickets_within_limit
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      True if no innings has more dismissals than its limit (10, or 2 in a super over); retired hurt / retired not
      out are not counted. NULL = not checkable.
  - name: bowler_quota_respected
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      Limited-overs matches with no rain rule only: True if no bowler started more than ceil(scheduled overs / 5)
      overs in an innings (10 in a 50-over match, 4 in a 20-over match; a 7-ball over Cricsheet lists as miscounted
      is still one over). Super overs are not counted. NULL = not checkable (Tests, a rain rule, no balls). Has not
      failed on any Cricsheet match as of the 2026-10-14 snapshot; the headline publishes how often it fires.
  - name: batters_within_limit
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      True if no innings has more than 12 distinct batters: eleven plus at most one concussion replacement (ICC
      playing conditions since August 2019). NULL = not checkable (no balls). Has not failed on any Cricsheet
      match as of the 2026-10-14 snapshot (nine innings have exactly 12); the headline publishes how often it fires.
  - name: target_matches
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      Limited-overs matches only: True if the stated second-innings target equals the first-innings total (penalty
      runs included) + 1. Checked only when no rain rule applied and the target is over the full scheduled overs;
      NULL otherwise (Tests, revised or missing targets, matches without a second innings).
  - name: result_consistent
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      True if the recorded result follows from the innings totals: a win by runs means the winner batted first and
      the margin equals the run difference (Tests: total runs difference); a win by wickets means the winner outscored
      the other side. NULL = not checkable: no winner (draw, tie, no result), a rain rule or award (method set),
      or a Test won by an innings.
  - name: result_in_ball_stream
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      True if the recorded winner also follows from the ball stream alone (delivery runs and pre-innings penalties;
      post-innings penalty runs are not on any ball). False if the result needs events outside the ball stream:
      the winner only wins once a post-innings penalty award is added (match 1420222, won by 5 untimed penalty runs
      after its balls ended 4 short). Such a match fails passes_quality, so models do not count it as evaluated.
      NULL = not checkable: same cases as result_consistent.
  - name: is_awarded
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      True if the match was awarded rather than played out (Cricsheet outcome method 'Awarded', e.g. the 2006 Oval
      Test). Awarded matches always fail passes_quality.
    required: true
  - name: has_balls
    logicalType: boolean
    physicalType: BOOLEAN
    description: True if Cricsheet recorded at least one innings for the match.
    required: true
  - name: cricsheet_missing_fields_noted
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      True if Cricsheet's own file notes a missing field for the match (a fielding powerplay, the player of the
      match, reviews). Informational: it is not a defect in the ball stream and never fails passes_quality.
    required: true
  - name: passes_quality
    logicalType: boolean
    physicalType: BOOLEAN
    description: >-
      Overall verdict: True unless at least one check above is explicitly False or the match was awarded. NULL checks
      (not checkable) never fail a match. Never NULL.
    required: true
  quality:
  - name: row_count_floor_full_data
    description: on the complete snapshots, at least 90 to 95% of the 23,132 rows of the 2026-10-27 real
      build, so a snapshot or step that silently lost rows fails (skipped for the SUBSET CI sample)
    metric: rowCount
    mustBeGreaterOrEqualTo: 21000
    customProperties:
    - property: fullDataOnly
      value: true
  - name: passes_quality_follows_checks
    description: passes_quality is exactly 'no check is false and not awarded'
    type: sql
    query: SELECT count(*) FROM ${table} WHERE passes_quality <> (coalesce(NOT (runs_add_up IS FALSE OR extras_add_up
      IS FALSE OR overs_consistent IS FALSE OR wickets_within_limit IS FALSE OR bowler_quota_respected IS FALSE
      OR batters_within_limit IS FALSE OR target_matches IS FALSE OR result_consistent IS FALSE
      OR result_in_ball_stream IS FALSE), true) AND NOT is_awarded)
    mustBe: 0
customProperties:
- property: layer
  value: gold
- property: kind
  value: derived
- property: sources
  value:
  - cricsheet
  - derived
- property: upstream
  value:
  - matches
  - innings
  - balls
