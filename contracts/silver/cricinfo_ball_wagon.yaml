apiVersion: v3.1.0
kind: DataContract
id: cricket-sim.silver.cricinfo_ball_wagon
name: cricinfo_ball_wagon
version: 1.0.0
status: active
domain: cricket
dataProduct: cricket-sim
description:
  purpose: Where Cricinfo recorded each tracked ball going, for internal analysis.
  limitations: 'Cricinfo-derived (via Ari Adaikalam''s dataset), non-commercial: never exported. Only balls Cricinfo
    tracked. Wagon coordinates have no documented scale or origin. Recorded after the ball, so never a pre-ball
    input.'
schema:
- name: cricinfo_ball_wagon
  physicalName: data/silver/cricinfo_ball_wagon.parquet
  physicalType: table
  logicalType: object
  description: 'Where Cricinfo recorded the ball going: shot direction and wagon-wheel coordinates, for balls Cricinfo
    tracked. Cricinfo-derived (via Ari Adaikalam''s dataset): never exported.'
  dataGranularityDescription: One row per Cricsheet delivery that has at least one of these values (sparse).
  properties:
  - name: match_id
    logicalType: string
    physicalType: VARCHAR
    description: Cricsheet match id (the same id as the Cricinfo match id for most internationals). Joins to matches.match_id.
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    relationships:
    - to: matches.match_id
  - name: innings
    logicalType: integer
    physicalType: SMALLINT
    description: Innings number within the match, as numbered by Cricsheet (1 to 4; super overs are numbered as
      further innings). Part of the ball key.
    primaryKey: true
    primaryKeyPosition: 2
    required: true
  - name: delivery_number
    logicalType: integer
    physicalType: INTEGER
    description: Position of the delivery within its innings, counting every delivery including wides and no-balls,
      starting at 1 (Ari's key convention, equal to balls.delivery_number). Together with match_id and innings it
      joins this row to balls.
    primaryKey: true
    primaryKeyPosition: 3
    required: true
    customProperties:
    - property: unit
      value: deliveries
  - name: direction_cricinfo
    logicalType: string
    physicalType: VARCHAR
    description: 'Cricinfo''s label of the direction the ball was hit, relative to the batter: ''cover'', ''mid
      wicket'', ''mid off'', ''mid on'', ''point'', ''square leg'', ''third man'' or ''fine leg''. NULL when the
      ball was not hit to a recorded direction or has no wagon data.'
    customProperties:
    - property: timingClass
      value: result
    quality:
    - name: valid_direction
      metric: invalidValues
      arguments:
        validValues:
        - cover
        - mid wicket
        - mid off
        - mid on
        - point
        - square leg
        - third man
        - fine leg
      mustBe: 0
  - name: wagon_x
    logicalType: integer
    physicalType: INTEGER
    description: Horizontal pixel position of the ball's end point on Cricinfo's wagon-wheel graphic (observed range
      0 to 364, centre about 182). Origin and scale are not documented by the source. NULL when no wagon data.
    customProperties:
    - property: timingClass
      value: result
    - property: unit
      value: graphic pixels
  - name: wagon_y
    logicalType: integer
    physicalType: INTEGER
    description: Vertical pixel position of the ball's end point on Cricinfo's wagon-wheel graphic (observed range
      0 to 381, centre about 182). Origin and scale are not documented by the source. NULL when no wagon data.
    customProperties:
    - property: timingClass
      value: result
    - property: unit
      value: graphic pixels
  - name: wagon_zone
    logicalType: integer
    physicalType: SMALLINT
    description: Wagon-wheel sector 1 to 8 (eight sectors of the graphic around the pitch) that the end point falls
      in. NULL when no wagon data.
    customProperties:
    - property: timingClass
      value: result
    quality:
    - name: wagon_zone_in_range
      type: sql
      query: SELECT count(*) FROM ${table} WHERE ${column} NOT BETWEEN 1 AND 8
      mustBe: 0
  - name: wagon_angle
    logicalType: number
    physicalType: DOUBLE
    description: Angle of the end point around the pitch in degrees (0 to 360). The zero direction and whether it
      is mirrored for left-handers are not documented and it does not map one-to-one onto wagon_zone, so prefer
      wagon_zone or wagon_x/wagon_y. NULL when no wagon data.
    customProperties:
    - property: timingClass
      value: result
    - property: unit
      value: degrees
    quality:
    - name: wagon_angle_in_range
      type: sql
      query: SELECT count(*) FROM ${table} WHERE ${column} NOT BETWEEN 0 AND 360
      mustBe: 0
  - name: wagon_distance
    logicalType: number
    physicalType: DOUBLE
    description: Distance of the end point from the centre of the wagon wheel in the graphic's own scale (observed
      0.001 to 1.39; points flagged in the ring are at most 0.53 and those outside at least 0.40). Not a calibrated
      distance in metres or per ground. NULL when no wagon data.
    customProperties:
    - property: timingClass
      value: result
    - property: unit
      value: wagon-wheel radius units (uncalibrated)
    quality:
    - name: wagon_distance_in_range
      type: sql
      query: SELECT count(*) FROM ${table} WHERE ${column} NOT BETWEEN 0 AND 2
      mustBe: 0
  - name: wagon_in_ring
    logicalType: boolean
    physicalType: BOOLEAN
    description: TRUE if Cricinfo placed the end point inside the inner fielding ring, FALSE if outside it. NULL
      when no wagon data.
    customProperties:
    - property: timingClass
      value: result
  quality:
  - name: wagon_columns_null_together
    type: sql
    description: The wagon-wheel coordinates, zone, angle and distance are recorded together or not at all.
    query: SELECT count(*) FROM ${table} WHERE (wagon_x IS NULL) <> (wagon_y IS NULL) OR (wagon_x IS NULL) <> (wagon_zone
      IS NULL) OR (wagon_x IS NULL) <> (wagon_angle IS NULL) OR (wagon_x IS NULL) <> (wagon_distance IS NULL)
    mustBe: 0
customProperties:
- property: layer
  value: silver
- property: kind
  value: event
- property: sources
  value:
  - ari
- property: upstream
  value:
  - stg_ari_tracking
- property: timingClass
  value: result
