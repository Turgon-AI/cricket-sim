apiVersion: v3.1.0
kind: DataContract
id: cricket-sim.silver.cricinfo_ball_pre
name: cricinfo_ball_pre
version: 1.0.0
status: active
domain: cricket
dataProduct: cricket-sim
description:
  purpose: Holds Cricinfo's win-probability and predicted-score model outputs as they stood BEFORE each ball, as a
    benchmark to score our own pre-ball models against on the same balls. Its timing class is benchmark_model,
    never a feature; the limitations say why.
  limitations: 'Sparse per-ball layer: a row exists only for balls where the source has a value, so a missing row
    means ''not recorded'', never ''zero'' or ''no''. Each value is the previous ball''s post-ball model output
    within the same innings (a lag), so it is NULL on the first ball of every innings even though the previous innings''
    final value was known; rows are kept only where at least one value exists. Coverage is limited to matches Cricinfo''s
    model scored: 4,239 matches (4,069 T20 matches from 2008 and 170 ODIs), no Tests, innings 1 and 2 only. The
    model output was recomputed after the fact by a model fitted on later seasons, so using it as a feature in a
    time-sliced backtest leaks later knowledge: treat it as a benchmark only.
    The perspective of the win probability (batting side or fielding side) has not been independently verified.
    Derived from Cricinfo data via Ari Adaikalam''s dataset: non-commercial licence, never exported.'
  usage: Join to balls on (match_id, innings, delivery_number). A build-time leak check confirms the value does
    not move on the ball it describes.
schema:
- name: cricinfo_ball_pre
  physicalName: data/silver/cricinfo_ball_pre.parquet
  physicalType: table
  logicalType: object
  description: Cricinfo's model outputs (win probability and predicted score) known before each ball, taken from
    the previous ball's output.
  dataGranularityDescription: One row per ball (match_id, innings, delivery_number) that has a pre-ball model value,
    1,026,807 rows.
  properties:
  - name: match_id
    logicalType: string
    physicalType: VARCHAR
    description: Cricsheet match id (the same id as the Cricinfo match id for most internationals). Joins to matches.match_id.
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    relationships:
    - to: matches.match_id
  - name: innings
    logicalType: integer
    physicalType: SMALLINT
    description: Innings number within the match, as numbered by Cricsheet (1 to 4; super overs are numbered as
      further innings). Part of the ball key.
    primaryKey: true
    primaryKeyPosition: 2
    required: true
  - name: delivery_number
    logicalType: integer
    physicalType: INTEGER
    description: Position of the delivery within its innings, counting every delivery including wides and no-balls,
      starting at 1 (Ari's key convention, equal to balls.delivery_number). Together with match_id and innings it
      joins this row to balls.
    primaryKey: true
    primaryKeyPosition: 3
    required: true
    customProperties:
    - property: unit
      value: deliveries
  - name: win_probability_before
    logicalType: number
    physicalType: DOUBLE
    description: Cricinfo's win probability (percent) as it stood before this ball, i.e. the model value after the
      previous ball of the same innings. NULL on the first ball of an innings.
    customProperties:
    - property: timingClass
      value: benchmark_model
    - property: unit
      value: '%'
    quality:
    - name: win_probability_in_range
      type: sql
      query: SELECT count(*) FROM ${table} WHERE ${column} NOT BETWEEN 0 AND 100
      mustBe: 0
  - name: predicted_score_before
    logicalType: integer
    physicalType: INTEGER
    description: Cricinfo's predicted score (runs) as it stood before this ball, i.e. the model value after the
      previous ball of the same innings. Presumably the projected innings total; the exact definition is not documented.
      NULL on the first ball of an innings.
    customProperties:
    - property: timingClass
      value: benchmark_model
    - property: unit
      value: runs
    quality:
    - name: predicted_score_non_negative
      type: sql
      query: SELECT count(*) FROM ${table} WHERE ${column} NOT BETWEEN 0 AND 1500
      mustBe: 0
  quality:
  - name: row_count_floor_full_data
    description: on the complete snapshots, at least 90 to 95% of the 1,026,807 rows of the 2026-10-27 real
      build, so a snapshot or step that silently lost rows fails (skipped for the SUBSET CI sample)
    metric: rowCount
    mustBeGreaterOrEqualTo: 970000
    customProperties:
    - property: fullDataOnly
      value: true
  - name: row_count_floor
    metric: rowCount
    mustBeGreaterOrEqualTo: 4000
customProperties:
- property: layer
  value: silver
- property: kind
  value: event
- property: sources
  value:
  - ari
- property: upstream
  value:
  - balls
  - stg_ari_tracking
- property: timingClass
  value: benchmark_model
