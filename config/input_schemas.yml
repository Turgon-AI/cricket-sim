- player_id:VARCHAR
- name:VARCHAR
- cricinfo_id:BIGINT
- full name:VARCHAR
- gender:VARCHAR
- country:VARCHAR
- batting style:VARCHAR
- bowling style:VARCHAR
- playing role:VARCHAR
- fielding style:VARCHAR
- first international year:BIGINT
- last international year:BIGINT
- major teams:VARCHAR
- image url:VARCHAR
ari_predictions:
- match_id:BIGINT
- innings:BIGINT
- delivery_number:BIGINT
- line:VARCHAR
- line_confidence:DOUBLE
- line_explicit:BIGINT
- length:VARCHAR
- length_confidence:DOUBLE
- length_explicit:BIGINT
- shot:VARCHAR
- shot_confidence:DOUBLE
- shot_explicit:BIGINT
- direction:VARCHAR
- direction_confidence:DOUBLE
- direction_explicit:BIGINT
ari_tracking:
- match_id:BIGINT
- innings:BIGINT
- delivery_number:BIGINT
- ball_line:VARCHAR
