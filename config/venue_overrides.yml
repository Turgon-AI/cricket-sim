  # The display city changed (Barbados -> Bridgetown, St Kitts -> Basseterre) once silver counted every match, which
  # would change the search strings. Pin the coordinates the earlier snapshot's Nominatim search returned instead.
  kensington-oval: {lat: 13.105317, lon: -59.6225631, source: "Nominatim 'Kensington Oval, Barbados' (venues_geo/2026-10-15)"}
