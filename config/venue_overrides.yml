  royal-brussels-cricket-club-ground: {wikidata_qid: Q65087740}
  bangabandhu-national-stadium: {wikidata_qid: Q806456}
  city-oval: {wikidata_qid: Q5123337}
  lisicji-jarak-cricket-ground: {wikidata_qid: Q113245092}
  mahinda-rajapaksa-international-cricket-stadium: {wikidata_qid: Q1684285}
  mission-road-ground: {wikidata_qid: Q23038215}
  namibia-cricket-ground: {wikidata_qid: Q133443345}
  sportpark-het-schootsveld: {wikidata_qid: Q7579625, country: Netherlands}
  sportpark-maarschalkerweerd: {wikidata_qid: Q2235985}
  tribhuvan-university-international-cricket-ground: {wikidata_qid: Q7840418}
  western-australia-cricket-association-ground: {wikidata_qid: Q2738971}
  # Wikidata item 'Chevrolet Park' (a former name) is the Bloemfontein ground; the automatic search had only the city.
  mangaung-oval: {wikidata_qid: Q5094407}
  maharaja-yadavindra-singh-international-cricket-stadium: {wikidata_qid: Q24747936, note: "Wikidata 'Mullanpur International Cricket Stadium' (New Chandigarh); was the city centroid"}
  # Scott Page Field is the Czech Cricket Union ground at Vinor, Prague (Wikidata 'Vinor Cricket Ground')
  scott-page-field: {wikidata_qid: Q106763991}

  # --- pinned OSM elements (resolved through Nominatim /lookup into the geo snapshot).
  # Wikidata Q7375723 has latitude +1.259 (northern hemisphere, ~280 km from Nairobi): a sign error. OSM has the club.
  ruaraka-sports-club-ground: {osm_ref: way/524758013, note: "Ruaraka Sports Club, Thika Road, Nairobi (OSM); Wikidata Q7375723 has the latitude sign wrong"}
  # Wikidata Q108795166 puts Happy Valley in the sea south of Akrotiri; the OSM pitch is in Episkopi Cantonment.
  happy-valley-ground: {osm_ref: way/241638311, country: Cyprus, note: "OSM pitch 'Happy Valley Ground', Episkopi Cantonment (Wikidata point was in the sea)"}
