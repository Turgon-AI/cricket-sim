# Manual fixes for the canonical venue table (src/cricket_sim/venues/).
#
# How canonical venues are formed: take the venue string up to its first comma (the "core name"),
# normalise it (lower case, no accents/punctuation, no leading "the"), and group identical cores.
# venue_id = slug of that core (plus a city suffix for split_by_city cores). It never depends on
# config/scope.yml or on match counts, so widening the scope cannot rename a venue.
# Every entry below must take effect: a stale entry (matching no Cricsheet string or venue_id) fails the build.

# venue_context: 'snapshot' (default) builds each venue once from every match in the snapshot, so a later
# spelling can move an earlier match's point and weather. 'asof' gives a venue a new version whenever its geocoder
# inputs (name, city, search names, places) or home team change, built only from matches up to that date; each match
# uses the version valid on its start date (silver venue_versions). Turn 'asof' on only together with a re-download of
# venues_geo and weather: with it on, a geocode or weather request the locked snapshots lack fails the build.
venue_context: asof

# home_team_gender: the home team of a ground (version) is the team in at least half of its internationals of this
# gender. Cricsheet team names carry no gender, so counting women's matches let them decide the men's side's home
# (Takashinga, Harare, 2019 became Tanzania's). Keep it equal to config/scope.yml gender (a test checks).
home_team_gender: male

# merge: primary core name -> other core names of the SAME ground (renames, sponsor names, misspellings).
# "Core|City" merges a core only where Cricsheet gives that city.
merge:
  "Arun Jaitley Stadium": ["Feroz Shah Kotla"]
  "Western Australia Cricket Association Ground": ["W.A.C.A. Ground", "WACA"]
  "Simonds Stadium": ["GMHBA Stadium"]
  "Seddon Park": ["Westpac Park"]
  "Westpac Stadium": ["Sky Stadium"]
  "Jade Stadium": ["AMI Stadium"]
  "Queenstown Events Centre": ["John Davies Oval"]
  "Kennington Oval": ["The Oval"]
  "Narendra Modi Stadium": ["Sardar Patel Stadium", "Sardar Patel (Gujarat) Stadium"]   # one site; see eras (rebuilt 2016-20)
  "Punjab Cricket Association IS Bindra Stadium": ["Punjab Cricket Association Stadium"]
  "Maharashtra Cricket Association Stadium": ["Subrata Roy Sahara Stadium"]
  "Dr. Y.S. Rajasekhara Reddy ACA-VDCA Cricket Stadium": ["Andhra Cricket Association-Visakhapatnam District Cricket Association Stadium"]
  "Saurashtra Cricket Association Stadium": ["Niranjan Shah Stadium"]
  # Nagpur has two grounds: the OLD Vidarbha CA Ground in Civil Lines (internationals until 2007) and the NEW
  # Vidarbha CA Stadium at Jamtha (from Nov 2008). "Vidarbha Cricket Association Ground" (2007 ODI) was wrongly
  # merged into Jamtha before; it is the old ground, like "Vidarbha C.A. Ground" (2005-06).
  "Vidarbha Cricket Association Ground": ["Vidarbha C.A. Ground"]
  "Reliance Stadium": ["Indian Petrochemicals Corporation Limited Sports Complex Ground"]
  "M Chinnaswamy Stadium": ["M.Chinnaswamy Stadium"]
  "R Premadasa Stadium": ["R.Premadasa Stadium"]
  "P Sara Oval": ["P Saravanamuttu Stadium"]
  "County Ground": ["The Cooper Associates County Ground", "The Royal & Sun Alliance County Ground"]
  "National Cricket Stadium": ["Queen's Park (New)"]
  "Sinhalese Sports Club Ground": ["Sinhalese Sports Club"]
  "Shere Bangla National Stadium": ["Sher-e-Bangla National Cricket Stadium"]
  "Zohur Ahmed Chowdhury Stadium": ["Zahur Ahmed Chowdhury Stadium", "Chittagong Divisional Stadium", "Bir Sreshtho Flight Lieutenant Matiur Rahman Stadium"]
  "Sylhet International Cricket Stadium": ["Sylhet Stadium"]
  "Narayanganj Osmani Stadium": ["Khan Shaheb Osman Ali Stadium"]
  "Dubai International Cricket Stadium": ["Dubai Sports City Cricket Stadium"]
  "Sharjah Cricket Stadium": ["Sharjah Cricket Association Stadium"]
  "Sheikh Zayed Stadium": ["Zayed Cricket Stadium"]
  "ICC Academy": ["ICC Global Cricket Academy"]
  "The Wanderers Stadium": ["New Wanderers Stadium", "Wanderers Stadium"]
  "Wanderers Cricket Ground": ["Wanderers"]
  "De Beers Diamond Oval": ["Diamond Oval"]
  # Bloemfontein's one international ground, under its sponsor names: Goodyear Park (to 2008), OUTsurance Oval
  # (2008-11), Chevrolet Park (2011-14), Mangaung Oval (since). Was split in two ids before.
  "Mangaung Oval": ["Goodyear Park", "Chevrolet Park", "OUTsurance Oval"]
  "Boland Park": ["Boland Bank Park"]
  # Potchefstroom: North West Cricket Stadium (2003 World Cup) = Sedgars Park = Senwes Park (same OSM way).
  # North-West University No1 Ground is a different (university) ground and stays separate.
  "Senwes Park": ["Sedgars Park", "North West Cricket Stadium"]
  # Clontarf Cricket Club, Dublin plays at Castle Avenue: one ground (same OSM way 230017371).
  "Castle Avenue": ["Clontarf Cricket Club Ground"]
  # Albergaria, Portugal: Gucherre and Santarem are names of the same ground (same OSM way and point).
  "Santarem Cricket Ground": ["Gucherre Cricket Ground"]
  # Bermuda National Stadium, Hamilton: Cricsheet also writes it "National Stadium, Hamilton".
  "Bermuda National Stadium": ["National Stadium|Hamilton"]
  # Darwin: the 2003 Test/2008 ODIs ("Marrara Cricket Ground") and the 2025-26 T20Is ("Marrara Stadium") were both at
  # Marrara Oval (TIO Stadium); the two Wikidata points are 150 m apart. Probable rather than certain.
  "Marrara Stadium": ["Marrara Cricket Ground"]
  # St George's College, Quilmes (Buenos Aires province): Cricsheet also writes "St Georges Quilmes"; same point.
  "St George's College Ground": ["St Georges Quilmes"]
  "Daren Sammy National Cricket Stadium": ["Darren Sammy National Cricket Stadium", "Beausejour Stadium"]
  "Gahanga International Cricket Stadium": ["Gahanga International Cricket Stadium. Rwanda"]
  "Bready Cricket Club": ["Bready"]
  "Grange Cricket Club Ground": ["Grange Cricket Club"]
  "Malahide": ["The Village"]
  "VRA Ground": ["VRA Cricket Ground"]
  "YSD-UKM Cricket Oval": ["UKM-YSD Cricket Oval"]
  "Moosa Cricket Stadium": ["Choice Moosa Stadium"]
  "Vassil Levski National Sports Academy": ["National Sports Academy"]
  "Bundaberg Rum Stadium": ["Cazaly's Stadium"]
  "Tony Ireland Stadium": ["Riverway Stadium"]
  # One ground under two ids each (same Wikidata item, same point).
  # Centurion: Centurion Park is the old name of SuperSport Park.
  "SuperSport Park": ["Centurion Park"]
  # Launceston: York Park, sponsor names Aurora Stadium (to 2021) and University of Tasmania Stadium (since).
  "University of Tasmania Stadium": ["Aurora Stadium"]
  # Lucknow: "Vajpai" is a Cricsheet typo. The "... Stadium B" ground is a second ground and stays apart.
  "Bharat Ratna Shri Atal Bihari Vajpayee Ekana Cricket Stadium": ["Bharat Ratna Shri Atal Bihari Vajpai Ekana Cricket Stadium"]

# assign: one exact Cricsheet "<venue> | <city>" string (city ~ = none) -> "Core" or "Core|City".
# For strings whose core name collides with a different ground. Found by listing core names that occur in
# several cities once silver covered every match.
assign:
  # St David's CC ground in Bermuda, not Lord's in London
  "Lords, St David's Cricket Club Ground | Bermuda": "St David's Cricket Club Ground"
  # a Women's Big Bash match in Hobart, not University Oval, Dunedin
  "University Oval, Hobart | Hobart": "University Oval Hobart"
  # the 2020 Plunket Shield match without a city was in Invercargill, not Chesterfield
  "Queen's Park | ~": "Queen's Park|Invercargill"

# split_by_city: core names shared by different grounds in different places -> "<slug>-<city slug>".
split_by_city:
  - "County Ground"
  - "National Stadium"
  - "Nehru Stadium"
  - "Gymkhana Club Ground"
  - "Queen's Park"

# city_aliases: spellings of the same city, only used to decide splits.
city_aliases:
  Chittagong: Chattogram
  Poona: Pune
  Bangalore: Bengaluru
  Dharmasala: Dharamsala

# eras: known rebuilds. match_venues.venue_era becomes "<venue_id>@<from>" from that date.
eras:
  narendra-modi-stadium:
    - {from: "2020-02-24", note: "Motera demolished 2016 and rebuilt; the new stadium opened in February 2020"}
  wankhede-stadium:
    - {from: "2011-01-01", note: "rebuilt 2010-11 for the 2011 World Cup"}

# venues: per-venue fixes keyed by venue_id. Any of:
#   name, city                    display fixes
#   country                       cricket territory (must be a key of territory_bounds in venue_reference.yml)
#   lat, lon (+ source)           explicit coordinates; geocode_source = manual
#   osm_ref: way/123              pin an OSM element (fetched into the geo snapshot); its centroid is the point
#   wikidata_qid                  pin a Wikidata item; it MUST carry coordinates (P625) or the build fails
#   nominatim_query, country_hint, skip_wikidata    steer the automatic search
#   elevation_m, city_elevation_m, timezone, coastal: true    sanity-check inputs
#   acknowledge: [check, ...]     a reviewed failed check (country/elevation/timezone/sea/anchor); keeps needs_review
#   needs_review: true, note
