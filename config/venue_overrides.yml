  niaz-stadium: {acknowledge: [anchor], note: "Cricsheet city 'Sind' is the province; the stadium is in Hyderabad, Sindh"}
  prairie-view-cricket-complex: {acknowledge: [anchor], note: "Prairie View, Texas is ~70 km from Houston"}
