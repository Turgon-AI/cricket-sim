# Cricket teams whose home is not a single territory of the same name. Teams not listed map to the territory
# with their own name (if it has a box), so "Cyprus" -> Cyprus.
team_territories:
  England: [England, Wales]
  Ireland: [Ireland, Northern Ireland]
  West Indies: [Jamaica, Barbados, Trinidad and Tobago, Guyana, Antigua and Barbuda, Saint Lucia,
                Saint Vincent and the Grenadines, Grenada, Dominica, Saint Kitts and Nevis]
  United States of America: [United States]
  Czech Republic: [Czechia]
  Swaziland: [Eswatini]
  Turks and Caicos Island: [Turks and Caicos Islands]

