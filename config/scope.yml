# Scope is applied in GOLD only. Silver keeps everything, so widening scope never needs a re-ingest.
gender: male
from_date: "2001-01-01"
full_members: [Afghanistan, Australia, Bangladesh, England, India, Ireland, New Zealand, Pakistan,
               South Africa, Sri Lanka, West Indies, Zimbabwe]
segments:
  - name: Test
    match_type: Test
    team_type: international
  - name: ODI
    match_type: ODI
    team_type: international
  # T20Is between two full members only: the reference list cannot verify associate T20Is
  # (61% of all men's T20Is since 2019), so their coverage cannot be claimed.
  - name: T20I
    match_type: T20
    team_type: international
    both_teams_in: full_members
  - name: IPL
    match_type: T20
    event_name: Indian Premier League
    missing_list: indian premier league
  # Men's franchise T20 leagues, one segment each (wave one, added 2026-11-18). From 2015-04-01: earlier BPL and BBL seasons are only 51 to 87%
  # held by Cricsheet. event_name_in lists every sponsor name a league has used. missing_list is the name the
  # league has on Cricsheet's missing list (lower case); a league with no gaps has no entry there.
  - name: T20 Blast
    match_type: T20
    event_name_in: [NatWest T20 Blast, Vitality Blast, Vitality Blast Men]
    from_date: "2015-04-01"
    missing_list: t20 blast
  - name: BBL
    match_type: T20
    event_name: Big Bash League
    from_date: "2015-04-01"
    missing_list: big bash league
  - name: BPL
    match_type: T20
    event_name: Bangladesh Premier League
    from_date: "2015-04-01"
    missing_list: bangladesh premier league
  - name: CPL
    match_type: T20
    event_name: Caribbean Premier League
    from_date: "2015-04-01"
    missing_list: caribbean premier league
  - name: PSL
    match_type: T20
    event_name: Pakistan Super League
    from_date: "2015-04-01"
    missing_list: pakistan super league
  - name: LPL
    match_type: T20
    event_name: Lanka Premier League
    from_date: "2015-04-01"
    missing_list: lanka premier league
  - name: ILT20
    match_type: T20
    event_name: International League T20
    from_date: "2015-04-01"
    missing_list: international league t20
  - name: SA20
    match_type: T20
    event_name: SA20
    from_date: "2015-04-01"
    missing_list: sa20
  - name: MLC
    match_type: T20
    event_name: Major League Cricket
    from_date: "2015-04-01"
    missing_list: major league cricket
