# Reviewed links between the Wikipedia reference list and Cricsheet that the strict rule cannot make
# (src/cricket_sim/wiki_fixtures.py link_reference: the two teams agree and start dates are within one day).
# Each entry names both sides and was checked by hand against the data. The linker adds them after the strict pass,
# as link_method 'reviewed_override'. The build fails if an entry names a row that does not exist, gives identifiers
# that do not match the data, has no reason, or touches a row the strict pass already linked (so this file cannot
# rewire a good link, and an entry the strict rule no longer needs must be removed).
