[project]
name = "cricket-sim"
version = "1.0.0"
description = "Reproducible bronze/silver/gold pipeline for ball-by-ball cricket data"
requires-python = "==3.12.*"
dependencies = [
    "duckdb==1.4.1",
    "pyarrow==21.0.0",
    "zstandard==0.25.0",
    "kagglehub==0.3.13",
    "requests==2.32.5",
    "pyyaml==6.0.3",
    "jsonschema==4.25.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
cricket = "cricket_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricket_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds the fixture a second time to prove reproducibility"]
