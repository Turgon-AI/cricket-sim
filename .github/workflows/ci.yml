# Every push and pull request: install the pinned environment, then run the whole test suite. The suite
# builds the committed fixture (tests/fixtures/tiny) end to end, twice: verify -> staging -> silver -> gold ->
# contracts -> export, the famous-match pins, the truncation leakage test, and the docs-are-current check.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Lint the data contracts against the ODCS schema
        run: uv run python -c "from cricket_sim import contracts; p = contracts.lint(); print('\n'.join(p)); raise SystemExit(bool(p))"
      - name: Test (fixture build x2, contracts, leakage, famous matches, export)
        run: uv run pytest -q
